# FOCA configuration
# Available as attributes of `foca.get_config()`
# Automatically validated via FOCA
# Cf. https://foca.readthedocs.io/en/latest/configuration/

# Server configuration; `host` and `port` apply to Flask's development server
# only (`python -m pro_tes.app`): the image serves the app with Gunicorn, on
# the address set in `pro_tes/gunicorn_config.py` (port 8080; change it via
# `GUNICORN_CMD_ARGS`, together with the published port and health check)
# Cf. https://foca.readthedocs.io/en/latest/configuration/server/
server:
  host: "0.0.0.0"
  port: 8080
  # Debug mode allows executing arbitrary code; only enable it for local
  # development, on a loopback host
  debug: False
  testing: False
  # Size limit of request bodies, in bytes (1 MiB); larger requests (also
  # chunked ones) are rejected with `413 Content Too Large` before
  # authentication and parsing
  max_content_length: 1048576

# Security configuration: the TES API requires access tokens of trusted
# issuers (OpenID Connect), except for `GET /service-info`; who may do what
# is decided by roles (`access_control`). Which identity provider is trusted,
# for which audiences, and which groups have which role is deployment
# configuration, without defaults: the app refuses to start without trusted
# issuers and a group mapped to the role `admin` (see `docs/access-control.md`)
# Cf. https://foca.readthedocs.io/en/latest/configuration/auth/
security:
  auth:
    add_key_to_claims: True
    algorithms:
      - RS256
    allow_expired: False
    # Only access tokens as per RFC 9068 (`typ` header `at+jwt`); other
    # tokens of the issuers, such as ID tokens, are rejected
    verify_token_type: True
    # Trusted token issuers (`iss` claim); tokens of other issuers are
    # rejected. Deployments set them, and `audience`: only tokens for the
    # apps calling proTES (e.g., the client IDs of its front ends) are
    # accepted, e.g.:
    # issuers:
    #   - https://login.example.org/oidc/
    # audience:
    #   - my-portal-client-id
    # Claims fetched from the user info endpoint of the issuer, e.g., groups
    # (if the identity provider doesn't put them into access tokens):
    # userinfo_claims:
    #   - groups
    # Deployments may also accept only tokens obtained by certain clients
    # (`client_id` claim, or `azp` if there is none), e.g., their front ends;
    # by default, clients are not restricted:
    # clients:
    #   - my-portal-client-id
    issuers: []
  # Access control: users (the role `user`) may create tasks, and list their
  # own; the user creating a task becomes its owner, and only owners may read
  # and cancel a task. Admins (the role `admin`) may only use the permissions
  # API, not the tasks of others. Roles are given to groups of the identity
  # provider (values of the claim `claim_groups`) by `group_mapping`, e.g.:
  # claim_groups: groups
  # group_mapping:
  #   compute-users: user
  #   compute-admins: admin
  # Cf. https://foca.readthedocs.io/en/latest/access-control/
  access_control:
    enabled: True
    enforce: True
    model: access_control/model.conf
    db_name: taskStore
    collection_name: policy_rules
    # Owners only, tasks are not shared
    resource_roles: [owner]
    # Managed on startup (removed rules are deleted); cannot be changed via
    # the permissions API. Named, so that overlays can change, add or remove
    # single rules by name (`null` removes a rule)
    policies:
      # `GET` lists the tasks of the user only
      users-create-list-tasks: [p, user, /ga4gh/tes/v1/tasks, (GET)|(HEAD)|(POST)]
      # `POST` is cancellation (`/tasks/{id}:cancel`)
      owners-get-cancel-tasks: [p, owner, "/ga4gh/tes/v1/tasks/:id", (GET)|(HEAD)|(POST)]
      admins-list-add-permissions: [p, admin, /admin/access-control/permissions, (GET)|(POST)]
      admins-manage-permissions: [p, admin, "/admin/access-control/permissions/:id", (GET)|(PUT)|(DELETE)]

# Database configuration
# Cf. https://foca.readthedocs.io/en/latest/configuration/db/
db:
  host: mongodb
  port: 27017
  dbs:
    taskStore:
      collections:
        tasks:
          # Task identifiers are unique, so that no task is stored under the
          # identifier of another (and its owner roles); creation fails while
          # stored tasks share identifiers (see docs/upgrading.md)
          indexes:
            - keys:
                task.id: 1
              options:
                "unique": True
            # Celery workers find tasks by worker identifier, and unfinished
            # tasks not polled for long, to resume their tracking
            - keys:
                worker_id: 1
            - keys:
                task.state: 1
                tracking.polled_at: 1
        middlewares:
          indexes:
            - keys:
                name: 1
              options:
                "unique": True
            - keys:
                class_path: 1
              options:
                "unique": True

# API configuration
# Cf. https://foca.readthedocs.io/en/latest/configuration/api/
# Spec paths are relative to this file. Named, so that overlays can change
# single specs by name, e.g., add `patches`
api:
  specs:
    tes:
      path:
        - api/9e9c5aa.task_execution_service.openapi.yaml
        - api/additions.openapi.yaml
        - api/security_schemes.yaml
      add_operation_fields:
        x-openapi-router-controller: pro_tes.ga4gh.tes.server
        security:
          - bearerAuth: []
      add_security_fields:
        x-bearerInfoFunc: foca.security.auth.validate_token
      disable_auth: False
      connexion:
        strict_validation: True
        # current specs have inconsistency, therefore disabling response validation
        # see: https://github.com/ga4gh/task-execution-schemas/issues/136
        validate_responses: False
        options:
          swagger_ui: True
          serve_spec: True
    # The middleware management API (`api/middleware_management.yaml`) is
    # not served until its controllers are implemented (#194)

# Logging configuration
# Cf. https://foca.readthedocs.io/en/latest/configuration/log/
log:
  version: 1
  disable_existing_loggers: False
  formatters:
    standard:
      class: logging.Formatter
      style: "{"
      format: "[{asctime}: {levelname:<8}] {message} [{name}]"
  handlers:
    console:
      class: logging.StreamHandler
      level: 20
      formatter: standard
      stream: ext://sys.stderr
  root:
    level: 10
    handlers: [console]

jobs:
  host: rabbitmq
  port: 5672
  backend: "rpc://"
  include:
    - pro_tes.tasks.track_task_progress

# Service info, served at `GET /service-info` by FOCA, according to the GA4GH
# `Service` schema (validated on startup); `version` defaults to the version
# of the installed package (`package`). Deployments set their own `id`,
# `name`, `description`, `organization`, `contactUrl` and `environment` (and
# `storage`, the storage locations of their TES backends); `id` and
# `organization` are placeholders with reserved example domains (RFC 2606),
# which the app warns of on startup. `backends` lists the URLs of the TES
# backends that tasks may be forwarded to, configured and discovered
# (`runtime_fields`; set it to null to hide them)
# Cf. https://foca.readthedocs.io/en/latest/configuration/service-info/
service_info:
  package: pro-tes
  runtime_fields: pro_tes.ga4gh.tes.discovery.service_info_fields
  service:
    id: org.example.protes
    name: proTES
    type:
      group: org.ga4gh
      artifact: tes
      version: 1.0.0
    description: >-
      Proxy for GA4GH Task Execution Service (TES) instances, distributing
      tasks across them.
    organization:
      name: Example Organization
      url: "https://example.org"
    documentationUrl: "https://github.com/elixir-cloud-aai/proTES"
    environment: dev

# Exception handling: problem details of exceptions, sent with the media type
# of error responses of the GA4GH specifications (instead of FOCA's default
# `application/problem+json`)
# Cf. https://foca.readthedocs.io/en/latest/configuration/exceptions/
exceptions:
  mapping: pro_tes.exceptions.exceptions
  media_type: application/json

# Custom configuration
custom:
  # The app refuses to start unless a group is mapped to the role `admin`
  # (`security.access_control.group_mapping`); set `require_admin` to false
  # to run without admins
  access_control:
    require_admin: True
  controllers:
    post_task:
      db:
        insert_attempts: 10
      task_id:
        charset: ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789
        length: 6
      # Tasks are polled at their backend every `wait` seconds until they
      # are finished; after `attempts` consecutive failed polls, their state
      # is `UNKNOWN`, and polls back off to every `max_wait` seconds at most
      # (both below 1800, RabbitMQ's default `consumer_timeout`)
      polling:
        wait: 3
        attempts: 100
        max_wait: 600
      # Tasks with credentials in the URLs of inputs or outputs
      # (`https://user:password@host/...`) are rejected (`reject`), or the
      # credentials are removed (`strip`); they are never stored or forwarded
      url_credentials: reject
      # Maximum size (bytes, UTF-8) of the inline content of each input of
      # a task (`inputs[].content`); larger tasks are rejected (`413`). The
      # minimum that TES recommends; all are limited by `max_content_length`
      max_inline_content: 131072
    # Tasks per page of `GET /tasks` if the request sets no `page_size`, and
    # at most (the TES specification requires fewer than 2048); at most
    # `max_page_size_full` of the view `FULL`, whose tasks may be large
    list_tasks:
      default_page_size: 256
      max_page_size: 2047
      max_page_size_full: 64

  # TES backends that tasks may be forwarded to, and how proTES authenticates
  # at them: with its own access token (`auth: client_credentials`, the
  # default), with HTTP Basic credentials from environment variables
  # (`auth: basic`; transitional, for backends that don't accept tokens yet)
  # or not at all (`auth: none`). Credentials of callers are never forwarded.
  # Deployments set their backends, e.g.:
  # service_list:
  #   - url: https://tes.example.org
  #   - url: https://tes.example.com
  #     auth: basic
  #     basic:
  #       username_env: TES_EXAMPLE_COM_USERNAME
  #       password_env: TES_EXAMPLE_COM_PASSWORD
  # client_credentials:
  #   issuer: https://login.example.org/oidc/
  # See `docs/access-control.md`
  tes:
    service_list: []
    # Discovery of further TES backends in a service registry (GA4GH Service
    # Registry API, with verified services, e.g., a Cloud Registry), read
    # without access token; off unless `registry_url` is set, e.g., to
    # https://registry.example.org/ga4gh/registry/v1. Only verified TES
    # services of the accepted `versions` (prefixes) and `environments` (any
    # if empty) are used, with `https` URLs and hosts with public addresses
    # (unless `allow_private_addresses`, for local setups only); the backends
    # of `service_list` take precedence. The list is read every
    # `refresh_interval` seconds, and the last good list kept while the
    # registry is unavailable. Discovered backends get `auth`
    # (`client_credentials` or `none`). See `docs/configuration.md`
    discovery:
      registry_url: null
      refresh_interval: 300
      timeout: 10
      versions:
        - "1.0"
        - "1.1"
      environments: []
      auth: client_credentials
      allow_private_addresses: false
    # URL schemes of backends, of the registry and of the identity provider;
    # add `http` for local tests only (credentials are sent unencrypted);
    # discovered backends need `https`
    url_schemes:
      - https
    # Client of proTES (OAuth 2.0 client credentials grant) for backends with
    # `auth: client_credentials`; the client ID and secret are read from the
    # environment variables `PROTES_CLIENT_ID` and `PROTES_CLIENT_SECRET`.
    # The token endpoint is that of the issuer's OpenID Connect discovery
    # document, unless `token_endpoint` is set
    client_credentials:
      issuer: null
      token_endpoint: null
      scope: null
      auth_method: client_secret_basic
      refresh_before: 60
      timeout: 10
    # Timeout of requests to TES backends, in seconds (of connecting: at most
    # 5 seconds). Tasks are created and canceled with a single request each:
    # if a backend doesn't answer in time, the task is not sent to another
    # backend (it may run already), but fails with `SYSTEM_ERROR`. Allow for
    # slow backends, but keep requests to create tasks (which may try several
    # backends) below the read timeout of a reverse proxy in front of proTES
    # (see `docs/configuration.md`)
    timeout: 15

  storeLogs:
    execution_trace: True

  middlewares:
    - - "pro_tes.plugins.middlewares.task_distribution.distance.TaskDistributionDistance"
      - "pro_tes.plugins.middlewares.task_distribution.random.TaskDistributionRandom"
