# Access control model of proTES (Casbin), cf.
# https://foca.readthedocs.io/en/latest/access-control/ and
# https://casbin.org/docs/syntax-for-models
#
[request_definition]
# sub - accessing entity (prefixed user identifier, or role from group claims)
# obj - accessed resource (request path)
# act - access method (HTTP method)
r = sub, obj, act

[policy_definition]
# sub - prefixed user identifier, role or `*` (any authenticated user)
# obj - resource path pattern (cf. https://casbin.org/docs/function, keyMatch2)
# act - HTTP method regular expression; must match the whole method, e.g.,
#       `GET` matches `GET` only, `(GET)|(POST)` matches `GET` and `POST`
p = sub, obj, act

[role_definition]
# g - roles: prefixed user identifier, role
g = _, _

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
# admins may do everything
m = g(r.sub, "admin") || ((p.sub == "*" || g(r.sub, p.sub)) && keyMatch2(r.obj, p.obj) && regexMatch(r.act, "^(" + p.act + ")$"))
