# Access control model of proTES (Casbin), cf.
# https://foca.readthedocs.io/en/latest/access-control/ and
# https://casbin.org/docs/syntax-for-models
#
# Unlike FOCA's reference model (`resource_role_model.conf`), the role `admin`
# may not do everything: admins only have the rights that rules give them
# (the permissions API), so that nobody but the owner of a task can read or
# cancel it.
#
[request_definition]
# sub - accessing entity (prefixed user identifier, or role from group claims)
# obj - accessed resource (request path)
# act - access method (HTTP method)
r = sub, obj, act

[policy_definition]
# sub - prefixed user identifier, role or `*` (any authenticated user)
# obj - resource path pattern (cf. https://casbin.org/docs/function, keyMatch2)
# act - HTTP method regular expression; must match the whole method, e.g.,
#       `GET` matches `GET` only, `(GET)|(POST)` matches `GET` and `POST`
p = sub, obj, act

[role_definition]
# g - global roles: prefixed user identifier, role
g = _, _
# g2 - resource-scoped roles (owners of tasks): prefixed user identifier,
#      role, resource (request path), e.g.,
#      `g2, user:alice, owner, /ga4gh/tes/v1/tasks/ABC123`
g2 = _, _, _

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = (p.sub == "*" || g(r.sub, p.sub) || g2(r.sub, p.sub, r.obj)) && keyMatch2(r.obj, p.obj) && regexMatch(r.act, "^(" + p.act + ")$")
