# Request Definition
# This section defines the structure of incoming access requests, including the subject (user), object (resource), and action.
[request_definition]
r = sub, obj, act

# Policy Definition
# This section specifies the structure of policies, detailing which roles have access to which resources and actions.
[policy_definition]
p = sub, obj, act

# Role Definition
# 'g' defines general group membership, while 'g2' is used for resource-specific roles like owner, maintainer, and viewer.
[role_definition]
g = _, _
g2 = _, _, _  # for resource-specific roles

# Policy Effect
# Determines the policy effect, allowing access if any policy matches.
[policy_effect]
e = some(where (p.eft == allow))

# Matchers
# This section contains the custom logic for access control, specifying how roles and actions map to permissions.
# Check if the user is a group member and is attempting to create a new resource.
m = g(r.sub, "group_member") && r.obj == "/tasks" && r.act == "POST" ||
    # Allow full access to the resource for its owner.
    g2(r.sub, "owner", r.obj) ||
    # Allow maintainers to view and cancel tasks but not modify access permissions.
    g2(r.sub, "maintainer", r.obj) && (r.act == "GET" || r.act == "POST:/tasks/{task-id}:cancel") ||
    # Allow viewers to only view tasks and perform no other actions.
    g2(r.sub, "viewer", r.obj) && r.act == "GET"
