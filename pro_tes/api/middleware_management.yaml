openapi: 3.0.3
info:
  title: proTES Middleware Management API
  description: |
    API for dynamically managing middleware in proTES (GA4GH Task Execution Service Proxy).
    This API allows runtime configuration of middleware components that process task execution requests.
  version: 1.0.0
  contact:
    name: ELIXIR Cloud & AAI
    url: https://github.com/elixir-cloud-aai/proTES
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

servers:
  - url: /protes/v1
    description: proTES Middleware Management API base path

tags:
  - name: Middleware Management
    description: Operations for managing middleware stack

paths:
  /middlewares:
    get:
      summary: List all middlewares
      description: |
        Retrieve all configured middlewares with their order, metadata, and status.
        Results are sorted by execution order (ascending) by default.
      operationId: ListMiddlewares
      tags:
        - Middleware Management
      parameters:
        - name: page_size
          in: query
          description: Maximum number of results to return per page
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: page
          in: query
          description: Page number to retrieve (0-indexed)
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: sort_by
          in: query
          description: Field to sort by
          required: false
          schema:
            type: string
            enum: [order, name, created_at, updated_at]
            default: order
        - name: enabled
          in: query
          description: Filter by enabled status
          required: false
          schema:
            type: boolean
        - name: source
          in: query
          description: Filter by middleware source type
          required: false
          schema:
            type: string
            enum: [local, github, pypi]
      responses:
        '200':
          description: Successful response with list of middlewares
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MiddlewareList'
        '400':
          description: Bad request (invalid parameters)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized (authentication required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (insufficient permissions)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      summary: Add a new middleware
      description: |
        Add a new middleware to the execution stack. Middleware can be loaded from:
        - Local packages: Installed Python packages with a class path entry point
        - GitHub repositories: Git repositories containing setup.py or pyproject.toml
        - PyPI packages: Packages from PyPI or other package registries
        
        If order is not specified, the middleware is appended to the end of the stack. 
        If order is specified, existing middlewares at that position or higher are 
        shifted up by one.
        
        Fallback groups can be created by providing an array of source configurations,
        allowing mixed sources (local, GitHub, PyPI) in a single middleware entry.
      operationId: AddMiddleware
      tags:
        - Middleware Management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MiddlewareCreate'
            examples:
              local_middleware:
                summary: Add local middleware
                value:
                  name: "Distance-based Router"
                  source:
                    type: "local"
                    entry_point: "pro_tes.plugins.middlewares.task_distribution.distance.TaskDistributionDistance"
                  order: 0
                  enabled: true
              github_middleware:
                summary: Add middleware from GitHub
                value:
                  name: "Custom Load Balancer"
                  source:
                    type: "github"
                    repository: "https://github.com/user/repo.git"
                    entry_point: "custom_middleware.LoadBalancer"
                  enabled: true
              pypi_middleware:
                summary: Add middleware from PyPI
                value:
                  name: "Third-party Middleware"
                  source:
                    type: "pypi"
                    package: "protes-middleware-custom"
                    entry_point: "custom.Middleware"
                    version: "1.0.0"
                  enabled: true
              fallback_group:
                summary: Add fallback group with mixed sources
                value:
                  name: "Load Balancing Group"
                  source:
                    - type: "local"
                      entry_point: "pro_tes.plugins.middlewares.task_distribution.distance.TaskDistributionDistance"
                    - type: "github"
                      repository: "https://github.com/org/fallback.git"
                      entry_point: "fallback.RandomRouter"
                    - type: "pypi"
                      package: "protes-fallback"
                      entry_point: "fallback.LastResort"
                  order: 0
                  enabled: true
      responses:
        '201':
          description: Middleware created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MiddlewareCreateResponse'
        '400':
          description: Invalid request (duplicate name/entry_point, invalid source, validation failed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized (authentication required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (insufficient permissions)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /middlewares/{middleware_id}:
    get:
      summary: Get middleware details
      description: Retrieve detailed information about a specific middleware by ID
      operationId: GetMiddleware
      tags:
        - Middleware Management
      parameters:
        - name: middleware_id
          in: path
          description: Unique identifier of the middleware
          required: true
          schema:
            type: string
            pattern: '^[a-f0-9]{24}$'
      responses:
        '200':
          description: Successful response with middleware details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MiddlewareConfig'
        '400':
          description: Bad request (invalid middleware ID format)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized (authentication required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (insufficient permissions)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Middleware not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      summary: Update middleware configuration
      description: |
        Update middleware configuration. Only name, order, config, and enabled fields
        can be updated. Source configuration (package type, repository, entry point) 
        cannot be modified for security reasons.
      operationId: UpdateMiddleware
      tags:
        - Middleware Management
      parameters:
        - name: middleware_id
          in: path
          description: Unique identifier of the middleware
          required: true
          schema:
            type: string
            pattern: '^[a-f0-9]{24}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MiddlewareUpdate'
      responses:
        '200':
          description: Middleware updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MiddlewareConfig'
        '400':
          description: Invalid request (invalid middleware ID format, invalid parameters)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized (authentication required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (insufficient permissions)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Middleware not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict (e.g., duplicate name)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      summary: Remove a middleware
      description: |
        Remove a middleware from the execution stack. By default performs soft delete
        (sets enabled=false). Use force=true query parameter for hard deletion.
      operationId: DeleteMiddleware
      tags:
        - Middleware Management
      parameters:
        - name: middleware_id
          in: path
          description: Unique identifier of the middleware
          required: true
          schema:
            type: string
            pattern: '^[a-f0-9]{24}$'
        - name: force
          in: query
          description: Perform hard delete (permanently remove)
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '204':
          description: Middleware deleted successfully
        '400':
          description: Bad request (invalid middleware ID format)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized (authentication required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (insufficient permissions)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Middleware not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /middlewares/reorder:
    put:
      summary: Reorder middleware stack
      description: |
        Reorder the entire middleware execution stack by providing an ordered array
        of middleware IDs. All middleware IDs must be provided in the desired execution order.
      operationId: ReorderMiddlewares
      tags:
        - Middleware Management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MiddlewareOrder'
      responses:
        '200':
          description: Middlewares reordered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Middleware stack reordered successfully"
                  middlewares:
                    type: array
                    items:
                      $ref: '#/components/schemas/MiddlewareConfig'
        '400':
          description: Invalid request (missing IDs, invalid IDs, duplicate IDs)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized (authentication required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (insufficient permissions)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /middlewares/validate:
    post:
      summary: Validate middleware code
      description: |
        Validate middleware code without adding it to the stack. Performs static
        analysis to check if the code is valid and safe. Useful for testing before
        deploying middleware.
      operationId: ValidateMiddleware
      tags:
        - Middleware Management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidationRequest'
      responses:
        '200':
          description: Validation results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
        '400':
          description: Invalid request (missing or invalid source configuration)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized (authentication required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (insufficient permissions)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    MiddlewareConfig:
      type: object
      description: Complete middleware configuration object
      required:
        - _id
        - name
        - source
        - order
        - enabled
        - created_at
        - updated_at
      properties:
        _id:
          type: string
          description: Unique identifier (MongoDB ObjectId)
          example: "507f1f77bcf86cd799439011"
        name:
          type: string
          description: Human-readable name for the middleware
          example: "Distance-based Router"
        source:
          oneOf:
            - $ref: '#/components/schemas/MiddlewareSource'
            - type: array
              description: Fallback group (array of middleware sources)
              items:
                $ref: '#/components/schemas/MiddlewareSource'
              minItems: 2
              example:
                - type: "local"
                  entry_point: "pro_tes.plugins.middlewares.task_distribution.distance.TaskDistributionDistance"
                - type: "github"
                  repository: "https://github.com/org/fallback.git"
                  entry_point: "fallback.RandomRouter"
        order:
          type: integer
          description: Execution order (0 = first)
          minimum: 0
          example: 0
        config:
          type: object
          description: Middleware-specific configuration
          nullable: true
          additionalProperties: true
          example:
            timeout: 30
            retries: 3
        enabled:
          type: boolean
          description: Whether the middleware is active
          example: true
        created_at:
          type: string
          format: date-time
          description: Creation timestamp
          example: "2026-01-24T10:30:00Z"
        updated_at:
          type: string
          format: date-time
          description: Last update timestamp
          example: "2026-01-24T10:30:00Z"

    MiddlewareSource:
      type: object
      description: Middleware package source configuration
      required:
        - type
        - entry_point
      properties:
        type:
          type: string
          description: Source type for the middleware package
          enum: [local, github, pypi]
        entry_point:
          type: string
          description: Class path entry point (e.g., 'package.module.ClassName')
          example: "pro_tes.plugins.middlewares.task_distribution.distance.TaskDistributionDistance"
        package:
          type: string
          description: Package name (required for pypi type)
          example: "protes-middleware-custom"
        repository:
          type: string
          description: Git repository URL (required for github type)
          pattern: '^https://github\.com/.+\.git$'
          example: "https://github.com/user/repo.git"
        version:
          type: string
          description: Package version (optional, for pypi or github tag/branch)
          example: "1.0.0"
      discriminator:
        propertyName: type

    MiddlewareCreate:
      type: object
      description: Request body for creating a middleware
      required:
        - name
        - source
      properties:
        name:
          type: string
          description: Human-readable name for the middleware
          minLength: 1
          maxLength: 255
          example: "Distance-based Router"
        source:
          oneOf:
            - $ref: '#/components/schemas/MiddlewareSource'
            - type: array
              description: Fallback group (array of middleware sources)
              items:
                $ref: '#/components/schemas/MiddlewareSource'
              minItems: 2
              example:
                - type: "local"
                  entry_point: "pro_tes.plugins.middlewares.task_distribution.distance.TaskDistributionDistance"
                - type: "github"
                  repository: "https://github.com/org/fallback.git"
                  entry_point: "fallback.RandomRouter"
        order:
          type: integer
          description: Execution order (omit to append to end)
          minimum: 0
          nullable: true
          example: 0
        config:
          type: object
          description: Middleware-specific configuration
          nullable: true
          additionalProperties: true
          example:
            timeout: 30
            retries: 3
        enabled:
          type: boolean
          description: Whether the middleware should be active
          default: true
          example: true

    MiddlewareUpdate:
      type: object
      description: Request body for updating a middleware
      properties:
        name:
          type: string
          description: Human-readable name for the middleware
          minLength: 1
          maxLength: 255
          example: "Distance-based Router v2"
        order:
          type: integer
          description: Execution order
          minimum: 0
          example: 1
        config:
          type: object
          description: Middleware-specific configuration
          nullable: true
          additionalProperties: true
          example:
            timeout: 60
            retries: 5
        enabled:
          type: boolean
          description: Whether the middleware is active
          example: false

    MiddlewareList:
      type: object
      description: Paginated list of middlewares
      required:
        - middlewares
        - pagination
      properties:
        middlewares:
          type: array
          description: Array of middleware configurations
          items:
            $ref: '#/components/schemas/MiddlewareConfig'
        pagination:
          type: object
          description: Pagination information following GA4GH guidelines
          required:
            - page
            - page_size
            - total
          properties:
            page:
              type: integer
              description: Current page number (0-indexed)
              example: 0
            page_size:
              type: integer
              description: Number of results per page
              example: 50
            total:
              type: integer
              description: Total number of middlewares available
              example: 5
            total_pages:
              type: integer
              description: Total number of pages available
              example: 1

    MiddlewareCreateResponse:
      type: object
      description: Response after creating a middleware
      required:
        - _id
        - order
        - message
      properties:
        _id:
          type: string
          description: Unique identifier of created middleware
          example: "507f1f77bcf86cd799439011"
        order:
          type: integer
          description: Assigned execution order
          example: 0
        message:
          type: string
          description: Success message
          example: "Middleware added successfully"

    MiddlewareOrder:
      type: object
      description: Request body for reordering middlewares
      required:
        - ordered_ids
      properties:
        ordered_ids:
          type: array
          description: Array of middleware IDs in desired execution order
          items:
            type: string
            pattern: '^[a-f0-9]{24}$'
          minItems: 1
          example:
            - "507f1f77bcf86cd799439011"
            - "507f1f77bcf86cd799439012"
            - "507f1f77bcf86cd799439013"

    ValidationRequest:
      type: object
      description: Request body for validating middleware code
      required:
        - source
      properties:
        source:
          $ref: '#/components/schemas/MiddlewareSource'

    ValidationResponse:
      type: object
      description: Validation results
      required:
        - valid
        - message
      properties:
        valid:
          type: boolean
          description: Whether the middleware code is valid
          example: true
        message:
          type: string
          description: Validation summary message
          example: "Middleware is valid and safe to use"
        errors:
          type: array
          description: List of validation errors (if any)
          items:
            type: object
            properties:
              line:
                type: integer
                description: Line number of error
                example: 15
              column:
                type: integer
                description: Column number of error
                example: 8
              message:
                type: string
                description: Error message
                example: "Method 'apply_middleware' not found"
              severity:
                type: string
                enum: [error, warning, info]
                example: "error"
        warnings:
          type: array
          description: List of validation warnings
          items:
            type: object
            properties:
              line:
                type: integer
                example: 20
              message:
                type: string
                example: "Consider adding type hints"
              severity:
                type: string
                enum: [error, warning, info]
                example: "warning"

    ErrorResponse:
      type: object
      description: Standard error response
      required:
        - code
        - message
      properties:
        code:
          type: integer
          description: HTTP status code
          example: 404
        message:
          type: string
          description: Human-readable error message
          example: "Middleware with ID '507f1f77bcf86cd799439011' not found"
