paths:
  # Served by FOCA from the config (`service_info`); the controller set here
  # takes precedence over the one added to all operations (`api.specs` in
  # `config.yaml`)
  /service-info:
    get:
      x-openapi-router-controller: foca.api.service_info
      # public
      security: []
  # proTES extensions of the TES specification: further responses of its
  # operations, which FOCA merges into them (the operations stay as they are)
  /tasks:
    post:
      responses:
        413:
          description: >-
            proTES extension: the request body exceeds the request size limit,
            or the inline content of an input (`inputs[].content`) exceeds
            the configured maximum (`max_inline_content`); the task is not
            kept.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /tasks/{id}:cancel:
    post:
      responses:
        409:
          description: >-
            proTES extension: the task has not finished, but its identifier
            at its TES instance is unknown (e.g., while it is being forwarded),
            so it can't be canceled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  # proTES extension: the provenance of a task (see docs/api.md)
  /tasks/{id}/provenance:
    get:
      tags:
      - TaskService
      summary: GetTaskProvenance
      description: |-
        proTES extension: get the provenance of a task, as recorded by the
        plugin engine of FOCA when the task was created and forwarded, with
        the plugin builds and the pipeline that it refers to. For the owner
        of the task and for admins.
      operationId: GetTaskProvenance
      parameters:
      - name: id
        in: path
        required: true
        description: ID of the task.
        schema:
          type: string
      responses:
        200:
          description: The provenance of the task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskProvenance'
        403:
          description: >-
            The caller is neither the owner of the task nor an admin (also
            for unknown tasks).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        404:
          description: >-
            The task wasn't found, or has no provenance (e.g., created by an
            earlier version of proTES).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
components:
  schemas:
    TaskProvenance:
      description: >-
        Provenance of a task: the record of FOCA's plugin engine (see the
        FOCA documentation, Plugins), with the plugin builds (`builds`) and
        the resolved pipeline (`pipeline.resolved`) that it refers to. Holds
        no IP addresses, tokens, header values or claims.
      type: object
      additionalProperties: true
      properties:
        engine:
          type: object
          description: Versions of FOCA, of its plugin API and of proTES.
        request_id:
          type: string
          nullable: true
          description: Identifier of the request that created the task.
        pipeline:
          type: object
          description: >-
            The pipeline: its `source` (`default`, `preset` or `client`),
            `preset`, `resolved` steps and their hash (`resolved_hash`).
        plugins:
          type: object
          additionalProperties:
            type: string
          description: Identifiers of the plugins that ran, by build hash.
        builds:
          type: object
          additionalProperties:
            type: object
          description: >-
            Builds of the plugins that ran (distribution, version, entry
            point, digests), by build hash.
        executions:
          type: array
          items:
            type: object
          description: >-
            Calls of plugin hooks, in order: step, phase, plugin, outcome,
            times, annotations and changed paths (without values).
        route:
          type: object
          description: TES instances before and after the `route` phase.
        selection:
          type: object
          nullable: true
          description: The client's choice of TES instances (`gateway.backends`).
        attempts:
          type: array
          items:
            type: object
          description: >-
            Forwarding attempts, in order: TES instance, outcome, reason,
            remote identifier and times.
        final_reason:
          type: string
          nullable: true
          description: >-
            Why no TES instance accepted the task, if none did
            (`outcome_unknown` if one may have).
    # Errors (RFC 9457), as proTES sends them
    ProblemDetails:
      description: 'Problem details of an error (RFC 9457).'
      type: object
      properties:
        title:
          type: string
          description: 'Short summary of the problem type.'
        status:
          type: integer
          description: 'HTTP status code.'
        detail:
          type: string
          description: 'Explanation of this occurrence of the problem.'
    # GA4GH service info schemas (version 1.0.0), as in
    # https://raw.githubusercontent.com/ga4gh-discovery/ga4gh-service-info/v1.0.0/service-info.yaml
    Service:
      description: 'GA4GH service'
      type: object
      required:
        - id
        - name
        - type
        - organization
        - version
      properties:
        id:
          type: string
          description: 'Unique ID of this service. Reverse domain name notation is recommended, though not required. The identifier should attempt to be globally unique so it can be used in downstream aggregator services e.g. Service Registry.'
          example: 'org.ga4gh.myservice'
        name:
          type: string
          description: 'Name of this service. Should be human readable.'
          example: 'My project'
        type:
          $ref: '#/components/schemas/ServiceType'
        description:
          type: string
          description: 'Description of the service. Should be human readable and provide information about the service.'
          example: 'This service provides...'
        organization:
          type: object
          description: 'Organization providing the service'
          required:
            - name
            - url
          properties:
            name:
              type: string
              description: 'Name of the organization responsible for the service'
              example: 'My organization'
            url:
              type: string
              format: uri
              description: 'URL of the website of the organization (RFC 3986 format)'
              example: 'https://example.com'
        contactUrl:
          type: string
          format: uri
          description: 'URL of the contact for the provider of this service, e.g. a link to a contact form (RFC 3986 format), or an email (RFC 2368 format).'
          example: 'mailto:support@example.com'
        documentationUrl:
          type: string
          format: uri
          description: 'URL of the documentation of this service (RFC 3986 format). This should help someone learn how to use your service, including any specifics required to access data, e.g. authentication.'
          example: 'https://docs.myservice.example.com'
        createdAt:
          type: string
          format: date-time
          description: 'Timestamp describing when the service was first deployed and available (RFC 3339 format)'
          example: '2019-06-04T12:58:19Z'
        updatedAt:
          type: string
          format: date-time
          description: 'Timestamp describing when the service was last updated (RFC 3339 format)'
          example: '2019-06-04T12:58:19Z'
        environment:
          type: string
          description: 'Environment the service is running in. Use this to distinguish between production, development and testing/staging deployments. Suggested values are prod, test, dev, staging. However this is advised and not enforced.'
          example: 'test'
        version:
          type: string
          description: 'Version of the service being described. Semantic versioning is recommended, but other identifiers, such as dates or commit hashes, are also allowed. The version should be changed whenever the service is updated.'
          example: '1.0.0'
    ServiceType:
      description: 'Type of a GA4GH service'
      type: object
      required:
        - group
        - artifact
        - version
      properties:
        group:
          type: string
          description: 'Namespace in reverse domain name format. Use `org.ga4gh` for implementations compliant with official GA4GH specifications. For services with custom APIs not standardized by GA4GH, or implementations diverging from official GA4GH specifications, use a different namespace (e.g. your organization''s reverse domain name).'
          example: 'org.ga4gh'
        artifact:
          type: string
          description: 'Name of the API or GA4GH specification implemented. Official GA4GH types should be assigned as part of standards approval process. Custom artifacts are supported.'
          example: 'beacon'
        version:
          type: string
          description: 'Version of the API or specification. GA4GH specifications use semantic versioning.'
          example: '1.0.0'
    tesTaskLog:
      properties:
        metadata:
          properties:
            forwarded_to:
              deprecated: true
              type: array
              items:
                $ref: '#/components/schemas/tesForward'
              description: |-
                Deprecated: use the tags `gateway.backend`,
                `gateway.backend_task_id` and `gateway.route` of the task
                (`GET /tasks/{id}`, views `BASIC` and `FULL`); to be removed
                in a later release. TES servers to which the task was
                forwarded, in the order of forwarding.
    tesForward:
      deprecated: true
      required:
        - id
        - url
      type: object
      properties:
        id:
          type: string
          description: Task identifier assigned by the TES server to which the task was forwarded.
          example: job-0012345
        url:
          type: string
          description: TES server to which the task was forwarded.
          example: https://my.tes.instance/
        forward_time:
          type: string
          description: |-
            When the task was forwarded, in RFC 3339 format; not set for
            forwards logged by earlier versions of proTES.
          example: 2020-10-02T10:00:00-05:00
      description: Describes a TES server to which the task was forwarded.
