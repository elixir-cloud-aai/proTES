# Config overlay for the Compose smoke test (`tests/smoke/compose.yaml`):
# tasks go to the fake TES backend only (no public TES instances), with the
# default plugin pipeline (ordered failover); the fake backend is also the
# identity provider (`fake_tes.py`)
security:
  auth:
    issuers:
      - http://fake-tes:8080/oidc/
    audience:
      - smoke-client
    userinfo_claims:
      - groups
  access_control:
    claim_groups: groups
    group_mapping:
      smoke-users: user
      smoke-admins: admin
custom:
  # proTES authenticates at the fake backend with its own access token of the
  # fake identity provider (client ID and secret in `compose.yaml`), over
  # plain HTTP inside the Compose network
  tes:
    backends:
      - type: ga4gh-tes
        url: http://fake-tes:8080
        url_schemes:
          - http
        auth: client_credentials
    url_schemes:
      - http
    client_credentials:
      issuer: http://fake-tes:8080/oidc/
  controllers:
    post_task:
      polling:
        wait: 1
