[build-system]
# CI installs setuptools-scm with the same bound to compute the version of
# images (`.github/workflows/checks.yaml`)
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 88
target-version = "py310"

[project]
name = "pro-tes"
authors = [{name = "ELIXIR On-Cloud"}, {email = "alexander.kanitz@alumni.ethz.ch"}]
keywords = [
    "ga4gh", "tes", "proxy", "gateway", "elixir", "cloud", "rest", "restful",
    "api", "app", "server", "openapi", "swagger", "mongodb", "python", "flask"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.10"
description = "Proxy for GA4GH Task Execution Service (TES) instances by ELIXIR On-Cloud"
license = "Apache-2.0"
dynamic = ["version"]
dependencies = [
    "connexion>=2.15.1,<3.0.0",
    # FOCA minors are bumped by hand, together with the base image in the
    # `Dockerfile` (`.github/dependabot.yml`)
    "foca>=0.15.0,<0.16",
    "geopy>=2.2.0,<3",
    "gunicorn>=26.2.0,<27",
    "ip2geotools>=0.1.6,<0.2",
    "py-tes>=1.1,<2",
]

[project.optional-dependencies]
dev = [
    "build>=1.6",
    "celery-types>=0.20.0",
    "coverage>=7.16",
    "flake8>=7.4",
    "flake8-docstrings>=1.7",
    "mongomock>=4.3",
    # Pinned until the strict mypy settings of the shared standard (#206)
    "mypy==1.14.1",
    "packaging>=26.3",
    "pylint>=4.1",
    "pytest>=9.1",
    # Used by the tests in `tests/unitTest`
    "pytest-ordering>=0.6",
    # Used by the tests; builds use `build-system.requires`
    "setuptools-scm>=10.3",
    # Used by the tests on Python 3.10 (`tomllib` from 3.11 on)
    "tomli>=2.3; python_version < '3.11'",
    "types-python-dateutil>=2.8.19.20240106",
    "types-PyYAML>=6.0.12",
    "types-requests>=2.28.5",
]

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
homepage = "https://github.com/elixir-cloud-aai/proTES.git"
Tracker = "https://github.com/elixir-cloud-aai/proTES/issues"

[tool.setuptools_scm]
# Version from Git tags (`vX.Y.Z`), the only place it is stored; builds
# without Git metadata (e.g., Docker builds, which get no `.git`) report the
# fallback unless `SETUPTOOLS_SCM_PRETEND_VERSION` is set
fallback_version = "0.0.0.dev0"

[tool.setuptools.packages.find]
include = ["pro_tes*"]

[tool.setuptools.package-data]
pro_tes = ["config.yaml", "api/*.yaml"]
