# Default values for protes_helm.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

applicationDomain: ""

# App config overriding the base config in the image (`pro_tes/config.yaml`
# of the image's version); mappings are merged recursively, other values
# (including lists) are replaced. Stored in a ConfigMap, so must not contain
# secrets. Deployments must set the trusted token issuers, the audience and
# the groups of the roles; the app refuses to start without them (see
# https://protes.readthedocs.io/en/latest/access-control/), e.g.:
config: {}
#   security:
#     auth:
#       issuers: ["https://login.example.org/oidc/"]
#       # Client IDs of the apps calling proTES
#       audience: ["my-portal-client-id"]
#       userinfo_claims: ["groups"]
#     access_control:
#       claim_groups: groups
#       group_mapping:
#         compute-users: user
#         compute-admins: admin

# which cluster type proTES is going to be deployed on
# it can be either 'kubernetes' or 'openshift'
clusterType: kubernetes

# mongodb-pvc.yaml/rabbitmq-pvc.yaml, change to ReadWriteMany if storageClass can do RWX
storageAccessMode: ReadWriteOnce

flower:
  appName: protes-flower
  basicAuth: admin:admin
  image: endocode/flower
  resources:
    limits:
      cpu: 200m
      memory: 500Mi
    requests:
      cpu: 200m
      memory: 500Mi

protes:
  appName: protes
  # Image and tag; the tag defaults to the chart's `appVersion`. An image
  # with a tag or digest (e.g., `elixircloud/protes:0.3.0`) is used as it
  # is (then `tag` must be empty)
  image: elixircloud/protes
  tag: ""
  initResources:
    limits:
      memory: 16Mi
      cpu: 50m
    requests:
      memory: 16Mi
  resources:
    limits:
      memory: 256Mi
      cpu: 100m
    requests:
      memory: 256Mi
      cpu: 100m

celeryWorker:
  appName: celery-worker
  # Image and tag, as `protes.image` and `protes.tag`; if `image` is empty,
  # the worker runs the app's image (`protes.image` and `protes.tag`), and
  # `tag` must be empty
  image: ""
  tag: ""
  initResources:
    limits:
      memory: 16Mi
      cpu: 50m
    requests:
      memory: 16Mi
      cpu: 50m
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 256Mi

mongodb:
  appName: mongodb
  secret:
    databaseRootUsername: ""
    databaseRootPassword: ""
    databaseUser: ""
    databasePassword: ""
    databaseName: ""
  volumeSize: 1Gi
  image: docker.io/library/mongo:noble
  resources:
    limits:
      cpu: 200m
      memory: 512Mi
    requests:
      cpu: 200m
      memory: 512Mi

rabbitmq:
  appName: rabbitmq
  volumeSize: 1Gi
  image: rabbitmq:4.1.4-management
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 200m
      memory: 256Mi
