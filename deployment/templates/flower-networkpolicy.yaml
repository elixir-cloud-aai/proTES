{{- /*
NetworkPolicies of Flower, if `flower.enabled` and
`flower.networkPolicy.enabled`: only the peers in
`flower.networkPolicy.ingressFrom` may connect to Flower (none by default,
so it is reached via `kubectl port-forward` only); and, with the bundled
broker and its NetworkPolicy, Flower's pods may connect to the broker, in
addition to the app's and the worker's (NetworkPolicies add up). Connections
from the pods' node (the kubelet's probes) are always allowed.
*/ -}}
{{- $context := dict "root" . "settings" (include "protes.settings" . | fromYaml) -}}
{{- include "foca-common.checkSettings" $context -}}
{{- $flower := .Values.flower | default dict -}}
{{- if and (dig "enabled" false $flower) (dig "networkPolicy" "enabled" false $flower) -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "protes.flowerFullname" . | quote }}
  labels:
    {{- include "foca-common.labels" (dict "root" . "component" "flower") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "foca-common.selectorLabels" (dict "root" . "component" "flower") | nindent 6 }}
  policyTypes:
  - Ingress
  {{- with $flower.networkPolicy.ingressFrom }}
  ingress:
  - from:
      {{- toYaml . | nindent 4 }}
    ports:
    - port: 5555
      protocol: TCP
  {{- else }}
  ingress: []
  {{- end }}
{{ end -}}
{{- if and (dig "enabled" false $flower) (include "foca-common.brokerEnabled" .) (dig "networkPolicy" "enabled" false .Values.broker) }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ printf "%s-from-flower" (include "foca-common.brokerFullname" . | trunc 51 | trimSuffix "-") | quote }}
  labels:
    {{- include "foca-common.labels" (dict "root" . "component" "broker") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "foca-common.selectorLabels" (dict "root" . "component" "broker") | nindent 6 }}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          {{- include "foca-common.selectorLabels" (dict "root" . "component" "flower") | nindent 10 }}
    ports:
    - port: 5672
      protocol: TCP
{{ end -}}
