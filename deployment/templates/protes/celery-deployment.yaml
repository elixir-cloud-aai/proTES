apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.celeryWorker.appName }}
spec:
  selector:
    matchLabels:
      app: {{ .Values.celeryWorker.appName }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/protes/protes-config.yaml") . | sha256sum }}
      labels:
        app: {{ .Values.celeryWorker.appName }}
    spec:
      initContainers:
      - name: vol-init
        image: busybox
        command: [ 'mkdir' ]
        args: [ '-p', '/data/db', '/data/output', '/data/tmp' ]
        resources: {{- toYaml .Values.celeryWorker.initResources | nindent 10 }}
        volumeMounts:
        - mountPath: /data
          name: protes-volume
      containers:
      - name: celery-worker
        image: {{ .Values.celeryWorker.image }}
        imagePullPolicy: Always
        command: [ 'celery' ]
        args: [ '-A', 'pro_tes.celery_worker', 'worker', '-E', '--loglevel=info', '-c', '1', '-Q', 'celery' ]
        env:
        - name: MONGO_HOST
          value: {{ .Values.mongodb.appName }}
        - name: MONGO_PORT
          value: "27017"
        - name: MONGO_USERNAME
          valueFrom:
            secretKeyRef:
              key: databaseUser
              name: {{ .Values.mongodb.appName }}
        - name: MONGO_PASSWORD
          valueFrom:
            secretKeyRef:
              key: databasePassword
              name: {{ .Values.mongodb.appName }}
        - name: MONGO_DBNAME
          valueFrom:
            secretKeyRef:
              key: databaseName
              name: {{ .Values.mongodb.appName }}
        - name: RABBIT_HOST
          value: {{ .Values.rabbitmq.appName }}
        - name: RABBIT_PORT
          value: "5672"
        - name: FOCA_CONFIG_OVERLAY
          value: /etc/protes/config.yaml
        resources: {{- toYaml .Values.celeryWorker.resources | nindent 10 }}
        volumeMounts:
        - mountPath: /data
          name: protes-volume
        - mountPath: /etc/protes
          name: protes-config
          readOnly: true
      volumes:
      - name: protes-volume
        persistentVolumeClaim:
          claimName: {{ .Values.protes.appName }}-volume
      - name: protes-config
        configMap:
          name: {{ .Values.protes.appName }}-config
