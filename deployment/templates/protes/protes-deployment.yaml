---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.protes.appName }}
spec:
  selector:
    matchLabels:
      app: {{ .Values.protes.appName }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/protes/protes-config.yaml") . | sha256sum }}
      labels:
        app: {{ .Values.protes.appName }}
    spec:
      {{- if eq .Values.storageAccessMode "ReadWriteOnce" }}
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - {{ .Values.celeryWorker.appName }}
            topologyKey: "kubernetes.io/hostname"
      {{- end }}
      initContainers:
      - name: vol-init
        image: busybox
        command: [ 'mkdir' ]
        args: [ '-p', '/data/db', '/data/specs' ]
        resources: {{- toYaml .Values.protes.initResources | nindent 10 }}
        volumeMounts:
        - mountPath: /data
          name: protes-volume
      containers:
      - name: protes
        image: {{ .Values.protes.image }}
        imagePullPolicy: Always
        command: [ 'gunicorn' ]
        args: [ '--config', 'python:pro_tes.gunicorn_config', '--log-level', 'debug', 'pro_tes.app:init_app()' ]
        env:
        - name: MONGO_HOST
          value: {{ .Values.mongodb.appName }}
        - name: MONGO_PORT
          value: "27017"
        - name: MONGO_USERNAME
          valueFrom:
            secretKeyRef:
              key: databaseUser
              name: {{ .Values.mongodb.appName }}
        - name: MONGO_PASSWORD
          valueFrom:
            secretKeyRef:
              key: databasePassword
              name: {{ .Values.mongodb.appName }}
        - name: MONGO_DBNAME
          valueFrom:
            secretKeyRef:
              key: databaseName
              name: {{ .Values.mongodb.appName }}
        - name: RABBIT_HOST
          value: {{ .Values.rabbitmq.appName }}
        - name: RABBIT_PORT
          value: "5672"
        - name: FOCA_CONFIG_OVERLAY
          value: /etc/protes/config.yaml
        resources: {{- toYaml .Values.protes.resources | nindent 10 }}
        livenessProbe:
          tcpSocket:
            port: protes-port
          initialDelaySeconds: 5
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /ga4gh/tes/v1/service-info
            port: protes-port
          initialDelaySeconds: 3
          periodSeconds: 3
        ports:
        - containerPort: 8080
          name: protes-port
        volumeMounts:
        - mountPath: /data
          name: protes-volume
        - mountPath: /etc/protes
          name: protes-config
          readOnly: true
      volumes:
      - name: protes-volume
        persistentVolumeClaim:
          claimName: {{ .Values.protes.appName }}-volume
      - name: protes-config
        configMap:
          name: {{ .Values.protes.appName }}-config
