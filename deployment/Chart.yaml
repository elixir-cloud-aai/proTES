apiVersion: v2
name: protes
description: >-
  proTES, a gateway for the GA4GH Task Execution Service API by ELIXIR
  On-Cloud, with its Celery worker, a MongoDB database and a RabbitMQ broker
type: application
# Placeholders: releases set `version` and `appVersion` from the tag
# (`vX.Y.Z`, see "Versioning and releases" in `docs/development.md`).
version: 0.0.0
# `appVersion` is the default image tag, so the chart in the repository
# deploys the `dev` image (of the latest commit on `dev`) unless `protes.tag`
# is set
appVersion: "dev"
dependencies:
  # The library chart of FOCA apps, with the templates of all resources (see
  # "Helm library chart" in FOCA's docs); `helm dependency build` downloads
  # the version locked in `Chart.lock` into `charts/`
  - name: foca-common
    version: 0.2.0
    repository: oci://ghcr.io/elixir-cloud-aai/charts
