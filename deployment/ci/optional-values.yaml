# Values for rendering the chart in CI with its optional parts: Flower, TES
# backends (`tes.backends`), credentials for TES instances from a Secret
# (`protes.extraEnv`) and plugins (`plugins`); used together with
# `test-values.yaml` (see `.github/workflows/ci.yml`)
protes:
  extraEnv:
  - name: TES_PASSWORD
    valueFrom:
      secretKeyRef:
        name: tes-credentials
        key: password
flower:
  enabled: true
  existingSecret: flower
tes:
  backends:
  - type: ga4gh-tes
    url: https://tes.example.org
    auth: basic
    basic:
      usernameEnv: TES_USERNAME
      passwordEnv: TES_PASSWORD
  - type: ga4gh-service-registry
    url: https://registry.example.org/ga4gh/registry/v1
    auth: none
plugins:
  pipeline:
  - id: route
    alternatives:
    - plugin: foca.routing.ordered
    onFailure: fail
  clientBackends:
    maxItems: 8
