site_name: proTES
site_description: >-
  Gateway for the GA4GH Task Execution Service API by ELIXIR On-Cloud
# Read the Docs serves each version under its own path (e.g., `/en/latest/`)
site_url: !ENV [READTHEDOCS_CANONICAL_URL, "https://protes.readthedocs.io/en/latest/"]
repo_url: https://github.com/elixir-cloud-aai/proTES
repo_name: elixir-cloud-aai/proTES
edit_uri: edit/dev/docs/
copyright: Copyright &copy; ELIXIR On-Cloud

# Python hooks of the build (not part of the site, nor their bytecode)
exclude_docs: |
  hooks.py
  __pycache__/
hooks:
  - docs/hooks.py

# Files included in pages (see `docs/hooks.py` and `pymdownx.snippets`)
watch:
  - README.md
  - deployment/README.md

theme:
  name: material
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  # Sections of `README.md` (between `--8<-- [start:<name>]` and
  # `--8<-- [end:<name>]`), so that they are not written twice; fails if a
  # file or section is missing
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: ["."]
          options:
            docstring_style: google
            # Fields of pydantic models are documented as `Args`, but have no
            # signature that griffe could check them against
            docstring_options:
              warn_unknown_params: false
              warn_missing_types: false
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            merge_init_into_class: true
            filters: ["!^_"]

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

# Add the notes of each release (`docs/releases/<version>.md`, read by the
# release workflow) to "Changelog"; the build fails for notes missing here
nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Configuration: configuration.md
  - API: api.md
  - Plugins: plugins.md
  - Access control: access-control.md
  - Deployment: deployment.md
  - Operations: operations.md
  - Upgrading: upgrading.md
  - Development: development.md
  - Contributing: contributing.md
  - API reference: reference.md
  - Changelog:
      - changelog.md
      - "0.3.0": releases/0.3.0.md
