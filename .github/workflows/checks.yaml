name: proTES checks

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

permissions:
  contents: read

# Cancel superseded runs of a pull request; runs for pushes get their own
# group, so that queued runs for successive pushes are not dropped
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze_code:
    name: Static code analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml
      # mypy checks imports, so runtime dependencies are needed too
      - name: Install dependencies
        run: |
          pip install --upgrade pip==24.0
          pip install -e ".[dev]"
      - name: Cache pre-commit hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run linters, type checks and security checks
        run: |
          pre-commit run --all-files --show-diff-on-failure
          pre-commit run --all-files --hook-stage manual gitleaks-all
      - name: Build distributions
        run: python -m build
      - name: Check wheel contents
        run: |
          unzip -Z1 dist/*.whl | tee wheel-contents.txt
          if grep -Ev '^pro_tes(/|-[^/]+\.dist-info/)' wheel-contents.txt; then
            echo "::error::Unexpected files in wheel"
            exit 1
          fi
          grep -qx 'pro_tes/config.yaml' wheel-contents.txt
          grep -Eqx 'pro_tes-[^/]+\.dist-info/licenses/LICENSE' wheel-contents.txt
          grep -q '^pro_tes/api/.*\.yaml$' wheel-contents.txt
  unit-test:
    name: Run unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          pip install --upgrade pip==24.0
          pip install -e ".[dev]"
      # The tests in `tests/unitTest` are not collectable yet (#207)
      - name: Run unit tests
        run: pytest tests --ignore=tests/unitTest --ignore=tests/test_integration
  test:
    name: Run tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Passed to the image build by Docker Compose, as for published images
      SETUPTOOLS_SCM_PRETEND_VERSION: 0.0.0+compose
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          pip install --upgrade pip==24.0
          pip install -e ".[dev]"
      - name: Deploy app
        # Waits until the containers are healthy (see their health checks)
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Check app version
        run: |
          actual="$(docker compose exec -T protes python -c \
            "from importlib.metadata import version; print(version('pro-tes'))")"
          if [ "${actual}" != "${SETUPTOOLS_SCM_PRETEND_VERSION}" ]; then
            echo "::error::App reports version '${actual}', expected '${SETUPTOOLS_SCM_PRETEND_VERSION}'"
            exit 1
          fi
      - name: Run integration tests
        shell: bash
        run: pytest tests/test_integration
      - name: Show app logs
        if: failure()
        run: docker compose logs
      - name: Tear down app
        run: docker compose down
  publish:
    name: Build and publish app image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.event_name == 'push' }}
    needs: [analyze_code, unit-test, test]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history and tags, to derive the version
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # The Docker build gets no Git metadata, so the version (e.g.,
      # `0.3.1.dev4+g<commit>`) is passed as a build argument
      - name: Derive version
        id: version
        # Same bound as in `build-system.requires` of `pyproject.toml`
        run: |
          pip install "setuptools-scm>=8"
          echo "version=$(python -m setuptools_scm)" >> "$GITHUB_OUTPUT"
      - name: Generate tag
        run: |
          echo "TAG=$(date '+%Y%m%d')" >> "$GITHUB_ENV"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_LOGIN }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Same tags as before (`latest` and the date); OCI label with the
      # version
      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_ORG }}/protes:latest
            ${{ secrets.DOCKERHUB_ORG }}/protes:${{ env.TAG }}
          labels: org.opencontainers.image.version=${{ steps.version.outputs.version }}
          build-args: SETUPTOOLS_SCM_PRETEND_VERSION=${{ steps.version.outputs.version }}
