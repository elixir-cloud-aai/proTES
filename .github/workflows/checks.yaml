name: proTES checks

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  lint:
    name: Run linting (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Pin pip version
        run: python -m pip install --upgrade "pip<24.1"
      - name: Install requirements
        run: |
          pip install .
          pip install -r requirements_dev.txt
      - name: Lint with Flake8
        run: flake8 pro_tes/ setup.py
      - name: Lint with Pylint
        run: pylint pro_tes/ setup.py
      - name: Type check with mypy
        run: mypy pro_tes/
  unit-test:
    name: Run unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install requirements
        run: |
          pip install .
          pip install -r requirements_dev.txt
      # The tests in `tests/unitTest` are not collectable yet (#207)
      - name: Run unit tests
        run: pytest tests --ignore=tests/unitTest --ignore=tests/test_integration
  test:
    name: Run tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Install requirements
        run: |
          pip install .
          pip install -r requirements_dev.txt
      - name: Deploy app
        run: docker compose up -d --build
      - name: Wait for app startup
        run: |
          for i in $(seq 1 24); do
            sleep 5; curl localhost:8080 -so /dev/null && break;
            docker compose ps;
            echo "Retrying ($i) in 5 seconds...";
          done
      - name: Run integration tests
        shell: bash
        run: pytest tests/test_integration
      - name: Tear down app
        run: docker compose down
  publish:
    name: Build and publish app image
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' }}
    needs: [lint, unit-test, test]
    steps:
      - name: Check out repository
        uses: actions/checkout@v3
      - name: Generate tag
        run: |
          echo "TAG=$(date '+%Y%m%d')" >> $GITHUB_ENV
      - name: Build and publish image
        id: docker
        uses: philips-software/docker-ci-scripts@v5.0.0
        with:
          dockerfile: .
          image-name: "protes"
          tags: "latest ${{ env.TAG }}"
          push-branches: "${{ github.event.repository.default_branch }}"
        env:
          REGISTRY_USERNAME: ${{ secrets.DOCKERHUB_LOGIN }}
          REGISTRY_TOKEN: "${{ secrets.DOCKERHUB_TOKEN }}"
          DOCKER_ORGANIZATION: ${{ secrets.DOCKERHUB_ORG }}
          GITHUB_ORGANIZATION: ${{ github.repository_owner }}
      - name: Verify that image was pushed
        run: |
          echo "Push indicator: ${{ steps.docker.outputs.push-indicator }}"
          echo "# Set to 'true' if image was pushed, empty string otherwise"
          test "${{ steps.docker.outputs.push-indicator }}" == "true"
