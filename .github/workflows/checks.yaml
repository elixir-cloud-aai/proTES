name: proTES checks

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

permissions:
  contents: read

# Cancel superseded runs of a pull request; runs for pushes get their own
# group, so that queued runs for successive pushes are not dropped
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze_code:
    name: Static code analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      # mypy checks imports, so runtime dependencies are needed too
      - name: Install dependencies
        run: |
          pip install --upgrade pip==24.0
          pip install -e ".[dev]"
      - name: Cache pre-commit hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run linters, type checks and security checks
        run: |
          pre-commit run --all-files --show-diff-on-failure
          pre-commit run --all-files --hook-stage manual gitleaks-all
      # In its own environment, as cffconvert pins an old jsonschema; its
      # dependencies resolve within its own bounds. 2.0.0 is the latest stable
      # release (not bumped by Dependabot; update manually)
      - name: Validate citation metadata
        run: pipx run --spec cffconvert==2.0.0 cffconvert --validate -i CITATION.cff
      - name: Build distributions
        run: python -m build
      - name: Check wheel contents
        run: |
          unzip -Z1 dist/*.whl | tee wheel-contents.txt
          if grep -Ev '^pro_tes(/|-[^/]+\.dist-info/)' wheel-contents.txt; then
            echo "::error::Unexpected files in wheel"
            exit 1
          fi
          grep -qx 'pro_tes/config.yaml' wheel-contents.txt
          grep -Eqx 'pro_tes-[^/]+\.dist-info/licenses/LICENSE' wheel-contents.txt
          grep -q '^pro_tes/api/.*\.yaml$' wheel-contents.txt
  # Job names don't name the Python version (that of the base image in the
  # Dockerfile), so that the required checks stay the same when it changes
  test:
    name: Run tests (mongomock)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          pip install --upgrade pip==24.0
          pip install -e ".[dev]"
      # The chart tests (run if Helm is installed, as on GitHub's runners)
      # need the library chart, the version locked in `Chart.lock`;
      # TEMPORARY: from the FOCA commit of `deployment/Chart.yaml` (#246)
      - name: Build chart dependencies
        run: |
          scripts/foca_common.sh
          helm dependency build deployment
      - name: Calculate unit test coverage
        run: |
          coverage run -m pytest -W ignore::DeprecationWarning
          coverage xml
      # Upload errors fail the workflow only on pushes, because pull requests
      # from forks and Dependabot get no access to the Codecov token
      - name: Submit Report to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: ${{ github.event_name == 'push' }}
          verbose: true
  # The `test` job uses mongomock; this one runs all tests against
  # MongoDB (`MONGODB_TEST_URI`, see `tests/conftest.py`), the version of
  # `docker-compose.yaml` (8.0 doesn't start on some kernels of the runners:
  # https://jira.mongodb.org/browse/SERVER-121912); coverage is reported by
  # `test`
  test_mongodb:
    name: Run tests (MongoDB 7.0)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongodb:
        image: mongo:7.0
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping: 1}).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      MONGODB_TEST_URI: mongodb://localhost:27017
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          pip install --upgrade pip==24.0
          pip install -e ".[dev]"
      # The chart tests (run if Helm is installed, as on GitHub's runners)
      # need the library chart, the version locked in `Chart.lock`;
      # TEMPORARY: from the FOCA commit of `deployment/Chart.yaml` (#246)
      - name: Build chart dependencies
        run: |
          scripts/foca_common.sh
          helm dependency build deployment
      # Fails instead of falling back to mongomock if the URI is missing
      - name: Run tests
        run: |
          test -n "${MONGODB_TEST_URI}"
          pytest -W ignore::DeprecationWarning
  # Stable check name for branch protection, independent of the test jobs
  tests_passed:
    name: Run tests
    runs-on: ubuntu-latest
    if: always()
    needs: [test, test_mongodb]
    steps:
      - name: Check that all test jobs passed
        run: |
          test "${{ needs.test.result }}" = "success"
          test "${{ needs.test_mongodb.result }}" = "success"
  helm:
    name: Check Helm chart
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          pip install --upgrade pip==24.0
          pip install -e ".[dev]"
      # The Helm version that the chart tests are written for
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.22.1
      # The library chart foca-common, the version locked in `Chart.lock`;
      # TEMPORARY: from the FOCA commit of `deployment/Chart.yaml` (#246)
      - name: Build chart dependencies
        run: |
          scripts/foca_common.sh
          helm dependency build deployment
      - name: Lint chart
        run: |
          helm lint deployment --strict -f deployment/ci/test-values.yaml
          helm lint deployment --strict -f deployment/ci/test-values.yaml \
            -f deployment/ci/optional-values.yaml
          helm lint deployment --strict -f deployment/ci/test-values.yaml \
            --set mongodb.auth.enabled=false --set mongodb.auth.existingSecret=
      # Fails instead of skipping the chart tests if helm is missing
      - name: Test chart
        run: |
          helm version
          pytest -W ignore::DeprecationWarning tests/test_chart.py tests/test_foca_common.py
  docs:
    name: Build documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Python version of Read the Docs (`.readthedocs.yaml`)
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: pip install -e ".[docs]"
      # Fails on warnings, e.g., of broken links, anchors and references
      - name: Build documentation
        run: mkdocs build --strict
  # Runs the app as deployed with Docker Compose (app, Celery worker,
  # MongoDB, RabbitMQ), relaying tasks to a fake TES backend instead of the
  # public TES instances of the config (`tests/smoke/`)
  smoke_test:
    name: Run app with Docker Compose
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_FILE: docker-compose.yaml:tests/smoke/compose.yaml
      PROBE_ENDPOINT: http://localhost:8080/ga4gh/tes/v1/ui/
      # Passed to the image build by Docker Compose, as for published images
      SETUPTOOLS_SCM_PRETEND_VERSION: 0.0.0+compose
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start app
        # Waits until the containers are healthy (see their health checks)
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Check that app responds
        run: |
          curl --fail --silent --show-error --output /dev/null \
            --header 'Accept: application/json' "${PROBE_ENDPOINT}"
      # Relays a task to the fake backend and checks the API (see the script)
      - name: Check API with fake TES backend
        run: tests/smoke/check.sh "${PROBE_ENDPOINT%/ui/}"
      - name: Check app version
        run: |
          actual="$(docker compose exec -T protes python -c \
            "from importlib.metadata import version; print(version('pro-tes'))")"
          if [ "${actual}" != "${SETUPTOOLS_SCM_PRETEND_VERSION}" ]; then
            echo "::error::App reports version '${actual}', expected '${SETUPTOOLS_SCM_PRETEND_VERSION}'"
            exit 1
          fi
      - name: Show app logs
        if: failure()
        run: docker compose logs
  publish:
    name: Build and publish app image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.event_name == 'push' }}
    needs: [analyze_code, tests_passed, helm, docs, smoke_test]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history and tags, to derive the version
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      # The Docker build gets no Git metadata, so the version (e.g.,
      # `0.3.1.dev4+g<commit>`) is passed as a build argument
      - name: Derive version
        id: version
        # Same bound as in `build-system.requires` of `pyproject.toml`
        run: |
          pip install "setuptools-scm>=8"
          echo "version=$(python -m setuptools_scm)" >> "$GITHUB_OUTPUT"
      - name: Generate tag
        run: |
          echo "TAG=$(date '+%Y%m%d')" >> "$GITHUB_ENV"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_LOGIN }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Same tags as before (`latest` and the date); OCI label with the
      # version
      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_ORG }}/protes:latest
            ${{ secrets.DOCKERHUB_ORG }}/protes:${{ env.TAG }}
          labels: org.opencontainers.image.version=${{ steps.version.outputs.version }}
          build-args: SETUPTOOLS_SCM_PRETEND_VERSION=${{ steps.version.outputs.version }}
