name: proTES release pins

# Checks that release tags (`vX.Y.Z`, also pre-releases) pin released versions
# of the dependencies only (`scripts/check_release_pins.py`), e.g., no FOCA
# commit or development image, before a GitHub release is published from the
# tag. To be replaced by a step of the release workflow (#44)
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check_release_pins:
    name: Check that dependencies are releases
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The script uses the standard library only; the Python version of
      # `checks.yaml`
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Check that dependencies are releases
        run: python scripts/check_release_pins.py
