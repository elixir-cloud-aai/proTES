# Scan the image of the latest release (`latest`) weekly for known
# vulnerabilities with Trivy, as the `scan` job of `ci.yml` scans the
# images of pull requests and pushes, so that vulnerabilities found after a
# release are reported: the findings that have a fix are uploaded to code
# scanning, a full report (findings without a fix included) is uploaded as the
# workflow artifact `trivy-report-release-image` (JSON and table), and the
# workflow fails on critical and high vulnerabilities that have a fix (fixed
# by a new release). Accepted findings are listed in `.trivyignore.yaml`.
# Scheduled runs use this workflow (with its pin of the shared action
# `elixir-cloud-aai/.github/actions/scan-image`) and `.trivyignore.yaml` as
# on the default branch, and file their findings under
# it; once that is `main`, these are the copies released with the scanned
# image, so findings accepted on `dev` after a release apply from the next
# release on (dismiss their alerts in code scanning until then). The image is
# public, so no Docker Hub secrets are needed; its organization is the
# repository variable `DOCKERHUB_ORG` (by default `elixircloud`, as in
# `ci.yml` and `release.yml`; forks set it to the organization they
# publish to).

name: Scan

on:
  schedule:
    # Mondays, 05:17 UTC
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Scheduled scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan image
        uses: elixir-cloud-aai/.github/actions/scan-image@743e82d290a53768454999e413756a924e383259 # v1.0.0
        with:
          image: docker.io/${{ vars.DOCKERHUB_ORG || 'elixircloud' }}/protes:latest
          category: release-image
          report: "true"
