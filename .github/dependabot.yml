version: 2
# Every entry targets `dev` (`target-branch`), which takes all pull
# requests whatever the default branch is (`main` only moves forward to
# releases); security updates always target the default branch, though
updates:
  # Dependencies in `pyproject.toml`
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    target-branch: dev
    versioning-strategy: increase-if-necessary
    ignore:
      # connexion 3 needs a FOCA upgrade
      - dependency-name: connexion
        update-types: ["version-update:semver-major"]
      # FOCA minors are bumped by hand, together with the base image (see the
      # `docker` entry)
      - dependency-name: foca
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      python-dependencies:
        patterns: ["*"]
        exclude-patterns: ["connexion", "foca"]
  # Actions in the workflows and in the local composite action
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/scan-image"]
    schedule:
      interval: monthly
    target-branch: dev
    groups:
      github-actions:
        patterns: ["*"]
  # Base image in the `Dockerfile` (tag and digest)
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    target-branch: dev
    ignore:
      # FOCA minors are bumped by hand, in the base image and the `foca`
      # requirement in `pyproject.toml` together (a new base image alone would
      # get the old FOCA reinstalled on top; see the `pip` entry)
      - dependency-name: elixircloud/foca
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # TEMPORARY, while the base image is FOCA's development image of the
      # commit that `pyproject.toml` pins (#214): its dated tag moves with
      # later commits, so updates of its digest would change FOCA; remove
      # with the FOCA release, keeping the entry above
      - dependency-name: elixircloud/foca
    groups:
      docker:
        patterns: ["*"]
