version: 2
# Every entry targets `dev` (`target-branch`), which takes all pull
# requests whatever the default branch is (`main` only moves forward to
# releases); security updates always target the default branch, though
updates:
  # Dependencies in `pyproject.toml`
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    target-branch: dev
    versioning-strategy: increase-if-necessary
    ignore:
      # connexion 3 needs a FOCA upgrade
      - dependency-name: connexion
        update-types: ["version-update:semver-major"]
      # FOCA minors are bumped by hand, together with the base image (see the
      # `docker` entry)
      - dependency-name: foca
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      # Dependencies of the documentation (the `docs` extra), in pull
      # requests of their own
      docs-dependencies:
        patterns: [
          "griffelib", "mkdocs", "mkdocs-*", "mkdocstrings",
          "mkdocstrings-*", "pymdown-extensions",
        ]
      # Dependencies match the first group listed
      python-dependencies:
        patterns: ["*"]
        exclude-patterns: ["connexion", "foca"]
  # Actions in the workflows, including the pins of the shared actions of
  # `elixir-cloud-aai/.github` (to the commits of its releases,
  # `@<commit> # vX.Y.Z`)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    target-branch: dev
    groups:
      github-actions:
        patterns: ["*"]
  # Base image in the `Dockerfile` (tag and digest)
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    target-branch: dev
    ignore:
      # FOCA minors are bumped by hand, in the base image and the `foca`
      # requirement in `pyproject.toml` together (a new base image alone would
      # get the old FOCA reinstalled on top; see the `pip` entry)
      - dependency-name: elixircloud/foca
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      docker:
        patterns: ["*"]
  # Hook revisions in `.pre-commit-config.yaml`
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: monthly
    target-branch: dev
    groups:
      pre-commit:
        patterns: ["*"]
